name: "DayBrief"
description: "Aggregate RSS, YouTube & podcast content, summarize with Gemini or OpenAI, and send an automated HTML newsletter."

branding:
  icon: "mail"
  color: "blue"

inputs:
  config:
    description: "Path to config.yaml"
    required: true
  commit-output:
    description: "Commit the newsletter JSON output to the repo"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25"

    - name: Build DayBrief from action source
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        go build -o daybrief ./cmd/daybrief
        chmod +x daybrief

    - name: Run DayBrief
      shell: bash
      run: "${{ github.action_path }}/daybrief run --config ${{ inputs.config }}"

    - name: Commit output
      if: inputs.commit-output == 'true'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/
        git diff --staged --quiet || git commit -m "chore: add newsletter $(date +%Y-%m-%d)"
        git push
